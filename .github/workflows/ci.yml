name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.markdown'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.markdown'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-check:
    name: PR validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # check includes type checking, linting, one build and the normal test suite.
      - run: npm run check

  check:
    name: check (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # npm run check already built the workspaces and extension.
      - run: node scripts/package-extension.mjs
      - run: node scripts/verify-extension-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zxcode-vsix-${{ matrix.os }}
          path: artifacts/*.vsix*
          if-no-files-found: error
      - run: npm run zxcode -- --help
      - run: npm exec -- zxcode --help
      - run: node scripts/compatibility/acceptance.mjs --report artifacts/m3-compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: m3-compatibility-${{ matrix.os }}
          path: artifacts/m3-compatibility.json
          if-no-files-found: error
      - run: node scripts/compatibility/run-service.mjs --report artifacts/m4-language-service.json
      - uses: actions/upload-artifact@v4
        with:
          name: m4-language-service-${{ matrix.os }}
          path: artifacts/m4-language-service.json
          if-no-files-found: error

  service-parity:
    name: M4 service platform parity
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: m4-language-service-*
          path: artifacts/m4-platforms
      - run: node scripts/compatibility/compare-service-reports.mjs artifacts/m4-platforms

  extension-smoke:
    name: VS Code development-host smoke
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a node scripts/test-extension.mjs
      - run: node scripts/package-extension.mjs
      - run: node scripts/verify-extension-package.mjs
      - run: xvfb-run -a node scripts/test-extension.mjs --installed

  package-parity:
    name: M5 VSIX platform parity
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: zxcode-vsix-*
          path: artifacts/vsix-platforms
      - run: node scripts/compare-package-reports.mjs artifacts/vsix-platforms
