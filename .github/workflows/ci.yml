name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run zxcode -- --help
      - run: npm exec -- zxcode --help
      - run: node scripts/compatibility/acceptance.mjs --report artifacts/m3-compatibility.json
      - uses: actions/upload-artifact@v4
        with:
          name: m3-compatibility-${{ matrix.os }}
          path: artifacts/m3-compatibility.json
          if-no-files-found: error
